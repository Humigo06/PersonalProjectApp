{% extends "base.html" %}

{% block title %}Rename Collection | Project Hub{% endblock %}

{% block content %}
<div class="form-page">
    <a class="back-link" href="{{ url_for('auth.library') }}">
        &larr; Back to Library
    </a>

    <div class="form-heading">
        <h1>Rename Collection</h1>
        <p class="page-description">
            Change the name of "{{ collection.name }}".
        </p>
    </div>

    <form method="POST" class="project-form">
        <div class="form-group">
            <label for="name">Collection Name</label>
            <input
                type="text"
                id="name"
                name="name"
                maxlength="100"
                value="{{ request.form.get('name', collection.name) }}"
                placeholder="Enter a collection name"
                required
            >
        </div>

        <div class="form-actions">
            <a class="button-secondary" href="{{ url_for('auth.library') }}">
                Cancel
            </a>
            <button type="submit">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
