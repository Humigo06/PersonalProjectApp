<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ project.name }} - Project Tracker</title>
</head>
<body>
    <p>
        <a href="{{ url_for('auth.library') }}">Back to Library</a>
    </p>

    <a href="{{ url_for('auth.edit_project', project_id=project.id) }}">Edit Project</a>

    <form method="POST"
        action="{{ url_for('auth.delete_project', project_id=project.id) }}"
        onsubmit="return confirm('Are you sure you want to delete this project?');">
        <button type="submit">Delete Project</button>
    </form>

    <h1>{{ project.name }}</h1>

    <p><strong>Collection:</strong> {{ project.collection.name }}</p>
    <p><strong>Status:</strong> {{ project.status | title }}</p>

    {% if project.description %}
        <h2>Description</h2>
        <p>{{ project.description }}</p>
    {% else %}
        <p>No description provided.</p>
    {% endif %}

</body>
</html>
