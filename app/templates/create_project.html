{% extends "base.html" %}

{% block title %}New Project | Project Hub{% endblock %}

{% block content %}
<div class="form-page">
    <a class="back-link" href="{{ url_for('auth.library') }}">
        &larr; Back to Library
    </a>

    <div class="form-heading">
        <h1>Create a Project</h1>
        <p class="page-description">
            Add a new project to your library.
        </p>
    </div>

    <form method="POST" class="project-form">
        <div class="form-group">
            <label for="name">Project Name</label>
            <input
                type="text"
                id="name"
                name="name"
                maxlength="150"
                value="{{ request.form.get('name', '') }}"
                placeholder="Enter a project name"
                required
            >
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea
                id="description"
                name="description"
                route="5"
                placeholder="What is this project about?"
            >{{ request.form.get('description', '') }}</textarea>
            <p class="field-hint">Optional. You can add more details later.</p>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="collection_id">Collection</label>
                <select id="collection_id" name="collection_id" required>
                    {% for collection in collections %}
                        <option
                            value="{{ collection.id }}"
                            {% if request.form.get('collection_id', '') == collection.id|string %}
                                selected
                            {% endif %}
                        >
                            {{ collection.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status" required>
                    {% for status in ['idea', 'active', 'paused', 'completed'] %}
                        <option
                            value="{{ status }}"
                            {% if request.form.get('status', 'idea') == status %}
                                selected
                            {% endif %}
                        >
                            {{ status | title }}
                        </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-actions">
            <a class="button-secondary" href="{{ url_for('auth.library') }}">
                Cancel
            </a>
            <button type="submit">Create Project</button>
        </div>
    </form>
</div>
{% endblock %}
