{% extends "base.html" %}

{% block title %}New Collection | Project Hub{% endblock %}

{% block content %}
<div class="form-page">
    <a class="back-link" href="{{ url_for('auth.library') }}">
        &larr; Back to Library
    </a>

    <div class="form-heading">
        <h1>Create a Collection</h1>
        <p class="page-description">
            Create a collection to organize your projects.
        </p>
    </div>

    <form method="POST" class="project-form">
        <div class="form-group">
            <label for="name">Collection Name</label>
            <input
                type="text"
                id="name"
                name="name"
                maxlength="100"
                value="{{ request.form.get('name', '') }}"
                placeholder="Enter a collection name"
                required
            >
            <p class="field-hint">
                Choose a name that helps you group related projects.
            </p>
        </div>

        <div class="form-actions">
            <a class="button-secondary" href="{{ url_for('auth.library') }}">
                Cancel
            </a>
            <button type="submit">Create Collection</button>
        </div>
    </form>
</div>
{% endblock %}
